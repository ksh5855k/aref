<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 서랍 - A!Ref</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 전체 컨테이너 */
        .drawer-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 헤더 박스 디자인 */
        .drawer-header-card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.03);
            padding: 50px 20px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            text-align: center;
            gap: 20px;
            
            margin-bottom: 40px;
        }

        /* 텍스트 디자인 */
        .drawer-text h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }
        
        .drawer-text p {
            margin: 0;
            color: #888;
            font-size: 1rem;
            font-weight: 500;
        }

        /* ★ 드롭다운 디자인 (겹침 방지 최종 솔루션) ★ */
        .sort-select-styled {
            /* 브라우저 기본 스타일 제거 */
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 50px;
            
            /* [핵심 1] 오른쪽 패딩을 45px로 아주 넓게 줌 -> 화살표 공간 확보 */
            padding: 10px 45px 10px 20px;
            
            /* [핵심 2] 텍스트는 무조건 왼쪽 정렬 -> 화살표와 멀어짐 */
            text-align: left;
            
            /* [핵심 3] 최소 너비 설정 -> 모양 유지 */
            min-width: 100px;
            
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            outline: none;
            
            /* 화살표 아이콘 위치 고정 (오른쪽에서 15px) */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23333%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center; 
            background-size: 14px auto;
        }

        .sort-select-styled:hover {
            border-color: #bbb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <header class="sticky-header">
        <div class="header-left">
            <a href="index.html" class="logo-link" onclick="sessionStorage.clear();"><h1>A!Ref</h1></a>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="키워드, 태그, 본문 내용 검색..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        <div id="auth-container">
            </div>
    </header>

    <div class="drawer-container">
        
        <div class="drawer-header-card">
            <div class="drawer-text">
                <h2>내 서랍 📂</h2>
                <p>내가 찜한 레퍼런스를 모아보는 나만의 공간</p>
            </div>
            
            <select id="sort-select" class="sort-select-styled">
                <option value="id-desc">최신순</option>
                <option value="views-desc">조회순</option>
                <option value="saves-desc">저장순</option>
            </select>
        </div>

        <div class="card-wrapper" id="my-drawer-list">
            <p class="loading-indicator">보관함을 여는 중입니다...</p>
        </div>
        
    </div>

    <footer>
        <p>&copy; 2026 A!Ref. All Rights Reserved.</p>
    </footer>

    <script type="module" src="mypage.js"></script>
    <script type="module" src="auth-status.js"></script>
</body>
</html>
