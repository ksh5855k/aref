<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 서랍 - A!Ref</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 전체 컨테이너 */
        .drawer-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 헤더 박스 디자인 */
        .drawer-header-card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.03);
            padding: 40px 20px 30px; /* 아래 패딩 줄임 */
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            text-align: center;
            gap: 20px;
            
            margin-bottom: 30px;
        }

        .drawer-text h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }
        
        .drawer-text p {
            margin: 0;
            color: #888;
            font-size: 1rem;
            font-weight: 500;
        }

        /* 정렬 드롭다운 */
        .sort-select-styled {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 50px;
            padding: 10px 45px 10px 20px;
            text-align: left;
            min-width: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            outline: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23333%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center; 
            background-size: 14px auto;
        }

        /* ★ 폴더 탭 영역 스타일 추가 */
        .folder-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 5px 15px 5px; /* 스크롤바 공간 확보 */
            width: 100%;
            justify-content: center; /* 중앙 정렬 */
            flex-wrap: wrap; /* 모바일에서 줄바꿈 허용 */
        }

        .folder-btn {
            background: #f1f3f5;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .folder-btn:hover {
            background: #e9ecef;
        }

        .folder-btn.active {
            background: #333;
            color: #fff;
            font-weight: bold;
        }

        .add-folder-btn {
            background: #fff;
            border: 1px dashed #ccc;
            color: #888;
        }
        
        /* 카드 내 폴더 이동 셀렉트박스 */
        .folder-select-mini {
            margin-top: 10px;
            width: 100%;
            padding: 6px;
            font-size: 0.8rem;
            border: 1px solid #eee;
            border-radius: 6px;
            color: #666;
            background: #f9f9f9;
        }

        /* ★ [추가됨] 다중 선택 툴바 스타일 (여기에도 넣어두어 확실하게 적용) */
        .bulk-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            flex-wrap: wrap;
        }
        
        .card-checkbox {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 22px;
            height: 22px;
            z-index: 10;
            cursor: pointer;
            accent-color: #333;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header class="sticky-header">
        <div class="header-left">
            <a href="index.html" class="logo-link" onclick="sessionStorage.clear();"><h1>A!Ref</h1></a>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="키워드, 태그, 본문 내용 검색..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        <div id="auth-container"></div>
    </header>

    <div class="drawer-container">
        <div class="drawer-header-card">
            <div class="drawer-text">
                <h2>내 서랍 📂</h2>
                <p>물음표(?)가 느낌표(!)로 바뀌는 나만의 레퍼런스 창고</p>
            </div>
            
            <select id="sort-select" class="sort-select-styled">
                <option value="id-desc">최신순</option>
                <option value="views-desc">조회순</option>
                <option value="saves-desc">저장순</option>
            </select>

            <div class="folder-tabs" id="folder-tabs-container">
                <button class="folder-btn active">전체</button>
                <button class="folder-btn add-folder-btn">+ 새 폴더</button>
            </div>
        </div>

        <div class="bulk-toolbar">
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin-right: 10px;">
                <input type="checkbox" id="select-all-checkbox" style="width: 18px; height: 18px;">
                <span style="font-size: 0.9rem; font-weight: bold;">전체 선택</span>
            </label>

            <select id="bulk-folder-select" class="sort-select-styled" style="flex-grow:1; min-width: 150px; padding: 8px;">
                <option value="">이동할 폴더 선택...</option>
                </select>

            <button id="bulk-move-btn" class="folder-btn active" style="border-radius: 8px;">이동</button>
            <button id="bulk-delete-btn" class="folder-btn" style="background-color: #fff0f0; color: #ff4757; border: 1px solid #ff4757; border-radius: 8px;">삭제</button>
        </div>

        <div class="card-wrapper" id="my-drawer-list">
            <p class="loading-indicator">보관함을 여는 중입니다...</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 A!Ref. All Rights Reserved.</p>
    </footer>

    <script type="module" src="mypage.js"></script>
    <script type="module" src="auth-status.js"></script>
</body>
</html>
