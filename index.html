<!DOCTYPE html>
<html lang="ko">

        <a href="index.html" class="logo-link" onclick="sessionStorage.clear();"><h1>A!Ref</h1></a>

        </select>

</div>

    <div class="card-wrapper">
        <p class="loading-indicator">임무 자료를 불러오는 중입니다...</p>
    </div>
