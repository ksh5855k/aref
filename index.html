<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A!Ref - 마케터의 레퍼런스 저장소</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sticky-header">
        <div class="header-left">
            <a href="index.html" class="logo-link" onclick="sessionStorage.clear();"><h1>A!Ref</h1></a>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="키워드, 태그, 본문 내용 검색..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        <div id="auth-container">
            </div>
    </header>

    <div class="main-container">
        <div class="filter-bar">
            <div class="tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">전체</button>
                <button class="tab-btn" onclick="filterCategory('디지털', this)">디지털</button>
                <button class="tab-btn" onclick="filterCategory('인쇄/옥외', this)">인쇄/옥외</button>
                <button class="tab-btn" onclick="filterCategory('프로모션', this)">프로모션</button>
                <button class="tab-btn" onclick="filterCategory('콘텐츠', this)">콘텐츠</button>
                <button class="tab-btn" onclick="filterCategory('인사이트', this)">인사이트</button>
                <button class="tab-btn" onclick="filterCategory('캠페인', this)">캠페인</button>
                <button class="tab-btn" onclick="filterCategory('기타', this)">기타</button>
            </div>

            <select id="sort-select" class="sort-dropdown">
                <option value="id-desc">최신순</option>
                <option value="views-desc">조회순</option>
                <option value="saves-desc">저장순</option>
            </select>
        </div>

        <div class="card-wrapper" id="reference-list">
            <p class="loading-indicator">데이터를 불러오는 중...</p>
        </div>

        <div id="load-more-container">
            <button id="load-more-btn">더 보기 ⬇️</button>
        </div>
    </div>

    <div id="save-modal-overlay" class="modal-overlay">
        <div class="save-modal">
            <h3>📂 어디에 보관할까요?</h3>
            <div class="modal-controls">
                <select id="modal-folder-select" class="modal-select">
                    <option value="all">기본 보관함 (전체)</option>
                </select>
                
                <input type="text" id="modal-new-folder-input" class="modal-input" placeholder="새 폴더 이름 입력 (선택사항)">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeSaveModal()">취소</button>
                <button class="modal-btn btn-confirm" id="modal-confirm-btn">저장하기</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 A!Ref. All Rights Reserved.</p>
    </footer>

    <script type="module" src="script.js"></script>
    <script type="module" src="auth-status.js"></script>
</body>
</html>
