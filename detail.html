<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레퍼런스 상세 - A!Ref</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sticky-header">
        <div class="header-left">
            <a href="index.html" class="logo-link" onclick="sessionStorage.clear();"><h1>A!Ref</h1></a>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="키워드, 태그, 본문 내용 검색..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        <div id="auth-container">
            </div>
    </header>

    <div class="detail-container">
        <div class="navigation-bar">
            <button id="back-to-list-btn" class="nav-text-btn">← 목록으로</button>
            <div class="nav-arrows">
                <button id="prev-btn" class="nav-arrow-btn" disabled>‹ 이전</button>
                <button id="next-btn" class="nav-arrow-btn" disabled>다음 ›</button>
            </div>
        </div>

        <div class="detail-content-wrapper">
            <div class="detail-media">
                <div id="video-container" style="display:none;"></div>
                <img id="detail-image" src="" alt="메인 이미지" style="display:none;">
            </div>

            <div class="detail-info">
                <span id="detail-category" class="category-badge">카테고리</span>
                <h1 id="detail-title">제목 로딩 중...</h1>
                <p id="detail-summary" class="detail-summary-text">요약 내용...</p>

                <div class="detail-actions">
                    <button id="go-link-btn" class="primary-btn">원본 링크로 이동 ↗</button>
                    <button id="detail-save-btn" class="secondary-btn" title="보관함에 저장">📂</button>
                    
                    <button id="share-btn" class="secondary-btn" title="링크 복사하기">🔗</button>
                    
                    <button id="edit-btn" class="secondary-btn" title="게시글 수정" style="display:none;">✏️</button>
                    <button id="delete-btn" class="delete-btn" style="display: none;">삭제</button>
                </div>

                <div class="detail-section">
                    <h3>캠페인 요약</h3>
                    <p id="detail-summary-long"></p>
                </div>

                <div class="detail-section">
                    <h3>Why it works</h3>
                    <p id="detail-why"></p>
                </div>

                <div class="detail-section">
                    <h3>How to apply</h3>
                    <p id="detail-how"></p>
                </div>

                <div id="detail-tags" class="tags-container"></div>

                <div class="comment-section">
                    <h3 class="section-title">💬 인사이트 톡 (Comments)</h3>
                    
                    <div id="comment-form-container" style="display: none;">
                        <textarea id="comment-input" placeholder="이 레퍼런스에서 발견한 인사이트를 나눠주세요! (매너 있는 대화 부탁드려요 🙏)"></textarea>
                        <button id="submit-comment-btn" class="primary-btn small-btn">등록</button>
                    </div>
                    
                    <div id="login-request-msg" style="display: none; text-align: center; margin: 20px 0; color: #666;">
                        <p>로그인하고 인사이트를 남겨보세요! <a href="login.html" style="color: #FB3959; font-weight: bold;">로그인하기</a></p>
                    </div>

                    <div id="comments-list" class="comments-list">
                        <p class="loading-text">댓글을 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 A!Ref. All Rights Reserved.</p>
    </footer>

    <script type="module" src="detail.js"></script>
    <script type="module" src="auth-status.js"></script>
    <script type="module" src="scroll-top.js"></script>
</body>
</html>
