<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - A!Ref</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="app-sidebar" id="app-sidebar">
        <div class="sidebar-header">
            <h2>A!Ref Menu</h2>
            <button class="close-sidebar-btn" id="close-sidebar">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html">🏠 홈 (Home)</a></li>
            <li><a href="about.html">📖 서비스 소개 (About)</a></li>
            <li><a href="contact.html">💬 문의/건의 (Contact)</a></li>
            <li style="border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px;"></li> <li><a href="mypage.html">📂 내 서랍 (My Drawer)</a></li>
            <li><a href="profile.html">⚙️ 내 계정 (My Account)</a></li>
        </ul>
        <div class="sidebar-footer"><p>From ? To !<br>&copy; 2026 A!Ref</p></div>
    </aside>

    <header class="sticky-header">
        <div class="header-left">
            <button class="menu-btn" id="menu-btn">
                <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <a href="index.html" class="logo-link"><h1>A!Ref</h1></a>
        </div>
        <div id="auth-container"></div>
    </header>

    <div class="main-container" style="max-width: 600px; margin: 60px auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">💬 문의 / 건의하기</h2>
        <div style="background: white; padding: 30px; border-radius: 12px; border: 1px solid #eee;">
            <form onsubmit="event.preventDefault(); alert('소중한 의견 감사합니다!'); location.href='index.html';">
                <div class="form-group">
                    <label style="display:block; margin-bottom:10px; font-weight:bold;">이메일</label>
                    <input type="email" placeholder="답변 받으실 이메일" required style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing: border-box;">
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label style="display:block; margin-bottom:10px; font-weight:bold;">내용</label>
                    <textarea placeholder="자유롭게 적어주세요!" rows="6" required style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing: border-box;"></textarea>
                </div>
                <button type="submit" style="width:100%; margin-top:30px; background:#333; color:white; padding:15px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">보내기 🚀</button>
            </form>
        </div>
    </div>

    <footer><p>&copy; 2026 A!Ref. All Rights Reserved.</p></footer>

    <script type="module" src="sidebar.js"></script>
    <script type="module" src="auth-status.js"></script>
</body>
</html>
