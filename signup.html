<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - A!Ref</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

    <div class="auth-card">
        <a href="index.html" class="auth-logo">A!Ref</a>
        <p class="auth-desc">환영합니다! 나만의 레퍼런스를 모아보세요.</p>

        <form id="signup-form">
            <input type="email" id="email" class="auth-input" placeholder="이메일 (아이디로 사용)" required autocomplete="email">
            
            <div class="password-wrapper">
                <input type="password" id="password" class="auth-input" placeholder="비밀번호 (6자리 이상)" required autocomplete="new-password">
                <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)">👁️</button>
            </div>

            <div class="password-wrapper">
                <input type="password" id="password-confirm" class="auth-input" placeholder="비밀번호 확인" required autocomplete="new-password">
                <button type="button" class="password-toggle-btn" onclick="togglePassword('password-confirm', this)">👁️</button>
            </div>

            <button type="submit" id="signup-btn" class="auth-btn">회원가입</button>
        </form>

        <a href="login.html" class="auth-link">이미 계정이 있으신가요? <strong>로그인</strong></a>

        <div class="auth-footer">
            &copy; 2026 A!Ref. All Rights Reserved.
        </div>
    </div>

    <script type="module" src="signup.js"></script>

    <script>
        const eyeOpenIcon = `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5 5-5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
        const eyeClosedIcon = `<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>`;

        document.querySelectorAll('.password-toggle-btn').forEach(btn => {
            btn.innerHTML = eyeOpenIcon;
        });

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = eyeClosedIcon;
            } else {
                input.type = "password";
                btn.innerHTML = eyeOpenIcon;
            }
        }
    </script>
</body>
</html>
